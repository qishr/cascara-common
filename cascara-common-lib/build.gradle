plugins {
    id "java-library"
    id "io.github.qishr.cascara.conventions" version "0.1.0"
    id "io.github.qishr.cascara.publish" version "0.1.1"
}

java { modularity.inferModulePath = true }

repositories {
	mavenLocal()
	mavenCentral()
}

dependencies {
    implementation(platform("io.github.qishr:cascara-meta-bom:$cascara_version"))

    testImplementation("org.junit.jupiter:junit-jupiter-api")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine")
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.mockito:mockito-junit-jupiter'
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:-missing', '-quiet')
}

tasks.named('compileTestJava', JavaCompile) {
    modularity.inferModulePath = true
}

test {
    useJUnitPlatform()
    jvmArgs = [
        "--add-reads", "cascara.common=org.mockito",
        '--module-path', "$buildDir/modulepath",
        '--add-modules', 'ALL-MODULE-PATH'
    ]
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

def addCascaraCommonTestOpens = { Test task ->
    def packages = [
        'data',
        'diagnostic',
        'lang.generic',
        'lang.processor',
        'property',
        'trackable',
        'util',
        'util.internal'
    ]

    packages.each { pkg ->
        task.jvmArgs([
            '--add-opens', "cascara.common/io.github.qishr.cascara.common.${pkg}=org.junit.platform.commons,ALL-UNNAMED"
        ])
    }
}

tasks.named('test', Test) {
    description = 'Runs tests in a JPMS modular environment (exploded classes).'

    // Ensure main and test resources are fully processed before test execution
    dependsOn tasks.named('processResources'), tasks.named('processTestResources')

    useJUnitPlatform {
        excludeTags 'requires-jar'
    }

    modularity.inferModulePath = false

    // Capture source set paths lazily during configuration time
    def runtimeClasspath = configurations.testRuntimeClasspath.asPath
    def mainClassesDir = sourceSets.main.output.classesDirs.asPath
    def mainResourcesDir = sourceSets.main.output.resourcesDir.absolutePath
    def testClassesDir = sourceSets.test.output.classesDirs.asPath
    def testResourcesDir = sourceSets.test.output.resourcesDir.absolutePath

    // Patch main resources, test classes, and test resources together into cascara.common
    def patchOutputs = "${mainResourcesDir}${File.pathSeparator}${testClassesDir}${File.pathSeparator}${testResourcesDir}"

    doFirst {
        def mainModuleName = 'cascara.common'

        jvmArgs([
            '--module-path', "${mainClassesDir}${File.pathSeparator}${runtimeClasspath}",
            '--add-modules', mainModuleName,
            '--patch-module', "${mainModuleName}=${patchOutputs}",
            '--add-reads', "${mainModuleName}=ALL-UNNAMED",
            '--add-modules', 'org.junit.platform.launcher',
            '--add-reads', "${mainModuleName}=org.junit.jupiter.api",
            '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
            '--add-opens', "java.base/java.lang=${mainModuleName}"
        ])
    }
}

tasks.register('testJarJPMS', Test) {
    description = 'Runs tests against the packaged JAR in a JPMS modular environment.'
    group = 'verification'

    dependsOn tasks.named('jar'), tasks.named('compileTestJava'), tasks.named('processTestResources')

    useJUnitPlatform {
        includeTags 'requires-jar'
        excludeTags 'no-jar'
    }

    modularity.inferModulePath = true

    testClassesDirs = project.sourceSets.test.output.classesDirs

    classpath = files(
        tasks.named('jar').flatMap { it.archiveFile },
        project.sourceSets.test.output,
        configurations.testRuntimeClasspath.filter { File file ->
            !file.name.contains("cascara-common")
        }
    )

    // Capture source set output paths lazily during configuration time
    def testClassesDir = sourceSets.test.output.classesDirs.asPath
    def testResourcesDir = sourceSets.test.output.resourcesDir.absolutePath
    def testOutputs = "${testClassesDir}${File.pathSeparator}${testResourcesDir}"
    def jarPath = tasks.named('jar').get().archiveFile.get().asFile.absolutePath
    def runtimeLibs = configurations.testRuntimeClasspath.filter { !it.name.contains('cascara-common') }.asPath
    def runtimeClasspath = "${jarPath}${File.pathSeparator}${runtimeLibs}"

    doFirst {
        def mainModuleName = 'cascara.common'
        jvmArgs([
            '--module-path', "${runtimeClasspath}",
            '--add-modules', mainModuleName,
            '--patch-module', "${mainModuleName}=${testOutputs}",
            '--add-reads', "${mainModuleName}=ALL-UNNAMED",
            '--add-modules', 'org.junit.platform.launcher',
            '--add-reads', "${mainModuleName}=org.junit.jupiter.api",
            '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
            '--add-opens', "java.base/java.lang=${mainModuleName}"
        ])
    }
}

tasks.register('testWithoutJPMS', Test) {
    description = 'Runs tests in a non-modular classpath environment (exploded classes only).'
    group = 'verification'

    dependsOn tasks.named('compileTestJava'), tasks.named('processTestResources')

    useJUnitPlatform {
        excludeTags 'requires-jar'
    }

    modularity.inferModulePath = false

    // Reference sourceSets safely via project scope during configuration time
    testClassesDirs = project.sourceSets.test.output.classesDirs

    classpath = files(
        project.sourceSets.main.output.classesDirs,
        project.sourceSets.main.output.resourcesDir,
        project.sourceSets.test.output,
        configurations.testRuntimeClasspath.filter { File file ->
            !file.name.contains("cascara-common")
        }
    )
}

tasks.register('testJarWithoutJPMS', Test) {
    description = 'Runs tests against the packaged JAR on a non-modular flat classpath.'
    group = 'verification'

    dependsOn tasks.named('jar'), tasks.named('compileTestJava'), tasks.named('processTestResources')

    useJUnitPlatform {
        includeTags 'requires-jar'
        excludeTags 'no-jar'
    }

    modularity.inferModulePath = false

    testClassesDirs = project.sourceSets.test.output.classesDirs

    classpath = files(
        tasks.named('jar').flatMap { it.archiveFile },
        project.sourceSets.test.output,
        configurations.testRuntimeClasspath.filter { File file ->
            !file.name.contains("cascara-common")
        }
    )
}

// Ensure running `gradle check` triggers all test modes
tasks.named('check') {
    dependsOn tasks.named('test'), tasks.named('testJarJPMS'), tasks.named('testWithoutJPMS'), tasks.named('testJarWithoutJPMS')
}

tasks.named('test', addCascaraCommonTestOpens)
tasks.named('testJarJPMS', addCascaraCommonTestOpens)




tasks.named('processResources', ProcessResources) { task ->
    // Capture configuration-phase values into local final variables
    def cascaraVersionVal = project.hasProperty('cascara_version') ? project.cascara_version.toString() : project.version.toString()
    def projectVersionVal = project.version.toString()

    // Capture destinationDir and classesDirs safely during configuration phase
    def destDir = task.destinationDir
    def classesDirs = sourceSets.main.output.classesDirs

    inputs.property("cascaraVersion", cascaraVersionVal)
    inputs.property("projectVersion", projectVersionVal)

    doLast {
        def versionText = "Manifest-Version: 1.0\r\n" +
                          "Cascara-Version: ${cascaraVersionVal}\r\n" +
                          "Implementation-Version: ${projectVersionVal}\r\n" +
                          "Module-Name: cascara.common\r\n"

        // Write to resources directory using the captured destination directory File object
        def resManifest = new File(destDir, "META-INF/MANIFEST.MF")
        resManifest.parentFile.mkdirs()
        resManifest.write(versionText, 'UTF-8')

        // Write to compiled classes directories
        classesDirs.each { dir ->
            def classManifest = new File(dir, "META-INF/MANIFEST.MF")
            classManifest.parentFile.mkdirs()
            classManifest.write(versionText, 'UTF-8')
        }
    }
}
