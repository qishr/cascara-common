tasks.named('processResources', ProcessResources) {
    inputs.property "version", project.version

    doLast {
        def versionText = "Manifest-Version: 1.0\r\nCascara-Version: ${project.cascara_version}\r\n"

        // Write to resources directory
        def resManifest = file("${destinationDir}/META-INF/MANIFEST.MF")
        resManifest.parentFile.mkdirs()
        resManifest.write(versionText, 'UTF-8')

        // Write to compiled classes directories so codeSource location finds it in exploded builds
        sourceSets.main.output.classesDirs.each { dir ->
            def classManifest = file("${dir}/META-INF/MANIFEST.MF")
            classManifest.parentFile.mkdirs()
            classManifest.write(versionText, 'UTF-8')
        }
    }
}


// cascara-common/build.gradle

jacocoTestReport {
    dependsOn tasks.named('test')
    dependsOn ':cascara-common-test:test' // Ensure tests run first

    // Combine execution data (.exec) from both common and common-test
    executionData.setFrom(files(
        "$buildDir/jacoco/test.exec",
        "${project(':cascara-common-test').buildDir}/jacoco/test.exec"
    ))

    // Ensure all internal packages (including service.internal) are included
    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(dir: it, include: [
            'io/github/qishr/cascara/common/**'
        ])
    }))

    reports {
        xml.required = true
        html.required = true
    }
}