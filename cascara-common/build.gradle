plugins {
    id "io.github.qishr.cascara-meta.java-library" version "0.1.0"
    id "io.github.qishr.cascara-meta.publish" version "0.1.0"
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

repositories {
	mavenLocal()
	mavenCentral()
}

dependencies {
    implementation(platform("io.github.qishr:cascara-meta-bom:$cascara_version"))

    testImplementation("org.junit.jupiter:junit-jupiter-api")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine")
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.mockito:mockito-junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:-missing', '-quiet')
}

tasks.named('compileTestJava', JavaCompile) {
    modularity.inferModulePath = true
}

tasks.named('test', Test) {
    description = 'Runs tests in a JPMS modular environment.'

    modularity.inferModulePath = true

    useJUnitPlatform {
        excludeTags 'requires-jar'
    }

    doFirst {
        def mainModuleName = 'cascara.common'
        def mainClassesDir = sourceSets.main.output.classesDirs.asPath
        def runtimeLibs = configurations.testRuntimeClasspath.asPath

        jvmArgs += [
            '--module-path', "${mainClassesDir}${File.pathSeparator}${runtimeLibs}",
            '--add-modules', mainModuleName,
            '--patch-module', "${mainModuleName}=${sourceSets.test.output.classesDirs.asPath}",
            '--add-reads', "${mainModuleName}=ALL-UNNAMED",
            '--add-modules', 'org.junit.platform.launcher',
            '--add-reads', 'cascara.common=org.junit.jupiter.api',
            '--add-opens', 'java.base/java.lang=ALL-UNNAMED'
        ]
    }
}


tasks.register('testClasspath', Test) {
    description = 'Runs tests in a non-modular classpath environment (exploded classes only).'
    group = 'verification'

    dependsOn tasks.named('compileTestJava'), tasks.named('processTestResources')

    testClassesDirs = sourceSets.test.output.classesDirs

    // Include exploded outputs, plus external third-party dependencies only
    classpath = files(
        sourceSets.main.output.classesDirs,
        sourceSets.main.output.resourcesDir,
        sourceSets.test.output,
        configurations.testRuntimeClasspath.filter { File file ->
            !file.name.contains("cascara-common")
        }
    )

    useJUnitPlatform {
        excludeTags 'requires-jar'
    }

    modularity.inferModulePath = false
}


tasks.register('testJarClasspath', Test) {
    description = 'Runs tests against the packaged JAR on a non-modular flat classpath.'
    group = 'verification'

    dependsOn tasks.named('jar'), tasks.named('compileTestJava'), tasks.named('processTestResources')

    testClassesDirs = sourceSets.test.output.classesDirs

    // Explicitly use the packaged JAR instead of exploded classes
    classpath = files(
        tasks.named('jar').flatMap { it.archiveFile },
        sourceSets.test.output,
        configurations.testRuntimeClasspath.filter { File file ->
            !file.name.contains("cascara-common")
        }
    )

    useJUnitPlatform {
        includeTags 'requires-jar'
        excludeTags 'no-jar'
    }

    modularity.inferModulePath = false
}


// Ensure running `gradle check` triggers both test modes
tasks.named('check') {
    dependsOn tasks.named('test'), tasks.named('testClasspath'), tasks.named('testJarClasspath')
}

tasks.named('processResources', ProcessResources) {
    inputs.property "version", project.version

    doLast {
        def versionText = "Manifest-Version: 1.0\r\nCascara-Version: ${project.cascara_version}\r\nImplementation-Version: ${project.version}\r\n"

        // Write to resources directory
        def resManifest = file("${destinationDir}/META-INF/MANIFEST.MF")
        resManifest.parentFile.mkdirs()
        resManifest.write(versionText, 'UTF-8')

        // Write to compiled classes directories so codeSource location finds it in exploded builds
        sourceSets.main.output.classesDirs.each { dir ->
            def classManifest = file("${dir}/META-INF/MANIFEST.MF")
            classManifest.parentFile.mkdirs()
            classManifest.write(versionText, 'UTF-8')
        }
    }
}

