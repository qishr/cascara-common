plugins {
    id "java-library"
    id "io.github.qishr.cascara.conventions" version "0.1.0"
    id "io.github.qishr.cascara.publish" version "0.1.0"
}

repositories {
	mavenLocal()
	mavenCentral()
}

dependencies {
    implementation(platform("io.github.qishr:cascara-meta-bom:$cascara_version"))

    testImplementation("org.junit.jupiter:junit-jupiter-api")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine")
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.mockito:mockito-junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:-missing', '-quiet')
}

tasks.named('compileTestJava', JavaCompile) {
    modularity.inferModulePath = true
}

tasks.named('test', Test) {
    description = 'Runs tests in a JPMS modular environment.'

    modularity.inferModulePath = true

    useJUnitPlatform {
        excludeTags 'requires-jar'
    }

    // Capture source set output paths lazily during configuration time
    def mainClassesDir = sourceSets.main.output.classesDirs
    def testClassesDir = sourceSets.test.output.classesDirs
    def runtimeClasspath = configurations.testRuntimeClasspath

    doFirst {
        def mainModuleName = 'cascara.common'

        jvmArgs([
            '--module-path', "${mainClassesDir.asPath}${File.pathSeparator}${runtimeClasspath.asPath}",
            '--add-modules', mainModuleName,
            '--patch-module', "${mainModuleName}=${testClassesDir.asPath}",
            '--add-reads', "${mainModuleName}=ALL-UNNAMED",
            '--add-modules', 'org.junit.platform.launcher',
            '--add-reads', 'cascara.common=org.junit.jupiter.api',
            '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
            '--add-opens', 'java.base/java.lang=cascara.common'
        ])
    }
}

tasks.register('testClasspath', Test) {
    description = 'Runs tests in a non-modular classpath environment (exploded classes only).'
    group = 'verification'

    dependsOn tasks.named('compileTestJava'), tasks.named('processTestResources')

    // Reference sourceSets safely via project scope during configuration time
    testClassesDirs = project.sourceSets.test.output.classesDirs

    classpath = files(
        project.sourceSets.main.output.classesDirs,
        project.sourceSets.main.output.resourcesDir,
        project.sourceSets.test.output,
        configurations.testRuntimeClasspath.filter { File file ->
            !file.name.contains("cascara-common")
        }
    )

    useJUnitPlatform {
        excludeTags 'requires-jar'
    }

    modularity.inferModulePath = false
}


tasks.register('testJarClasspath', Test) {
    description = 'Runs tests against the packaged JAR on a non-modular flat classpath.'
    group = 'verification'

    dependsOn tasks.named('jar'), tasks.named('compileTestJava'), tasks.named('processTestResources')

    testClassesDirs = project.sourceSets.test.output.classesDirs

    classpath = files(
        tasks.named('jar').flatMap { it.archiveFile },
        project.sourceSets.test.output,
        configurations.testRuntimeClasspath.filter { File file ->
            !file.name.contains("cascara-common")
        }
    )

    useJUnitPlatform {
        includeTags 'requires-jar'
        excludeTags 'no-jar'
    }

    modularity.inferModulePath = false
}


// Ensure running `gradle check` triggers all test modes
tasks.named('check') {
    dependsOn tasks.named('test'), tasks.named('testClasspath'), tasks.named('testJarClasspath')
}


tasks.named('processResources', ProcessResources) { task ->
    // Capture configuration-phase values into local final variables
    def cascaraVersionVal = project.hasProperty('cascara_version') ? project.cascara_version.toString() : project.version.toString()
    def projectVersionVal = project.version.toString()

    // Capture destinationDir and classesDirs safely during configuration phase
    def destDir = task.destinationDir
    def classesDirs = sourceSets.main.output.classesDirs

    inputs.property("cascaraVersion", cascaraVersionVal)
    inputs.property("projectVersion", projectVersionVal)

    doLast {
        def versionText = "Manifest-Version: 1.0\r\nCascara-Version: ${cascaraVersionVal}\r\nImplementation-Version: ${projectVersionVal}\r\n"

        // Write to resources directory using the captured destination directory File object
        def resManifest = new File(destDir, "META-INF/MANIFEST.MF")
        resManifest.parentFile.mkdirs()
        resManifest.write(versionText, 'UTF-8')

        // Write to compiled classes directories
        classesDirs.each { dir ->
            def classManifest = new File(dir, "META-INF/MANIFEST.MF")
            classManifest.parentFile.mkdirs()
            classManifest.write(versionText, 'UTF-8')
        }
    }
}
