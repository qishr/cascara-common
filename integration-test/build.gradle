plugins {
    id "io.github.qishr.cascara-meta.java-library" version "0.1.0"
    id 'eclipse'
    // id 'java-test-fixtures'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

repositories {
	mavenLocal()
	mavenCentral()
}

dependencies {
    implementation(platform("io.github.qishr:cascara-meta-bom:$cascara_version"))
    implementation("org.junit.jupiter:junit-jupiter-api")
    implementation("org.junit.jupiter:junit-jupiter-engine")
    implementation('org.junit.platform:junit-platform-launcher')
    implementation('io.github.qishr:cascara-test-common-junit')

    implementation "org.apache.logging.log4j:log4j-api:2.25.5"
    implementation 'org.apache.logging.log4j:log4j-core:2.25.5'
    implementation('io.github.qishr:cascara-logging-log4j')

    implementation('io.github.qishr:cascara-common')
    implementation('io.github.qishr:cascara-lang-json')
    implementation(project(':integration-test-fixtures'))
    // implementation(testFixtures(project(':integration-test-fixtures')))

}


tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:-missing', '-quiet')
}

test {
    useJUnitPlatform()
    jvmArgs = [
        '--module-path', "$buildDir/modulepath",
        '--add-modules', 'ALL-MODULE-PATH'
    ]
}

tasks.named('test', Test) {
    systemProperty 'java.net.preferIPv4Stack', 'true'
}


// tasks.named('test', Test) {
//     jvmArgs '--add-opens=java.base/java.lang=cascara.common'
// }

// tasks.named('integrationTest') { // or your integration test task name
//     dependsOn(':integration-test:jar', ':integration-test:assembleTestFixtures') // adjust to match your fixture module tasks
// }

tasks.named('javadocJar') {
    enabled = false
}

tasks.named('sourcesJar') {
    enabled = false
}

tasks.named('compileTestJava', JavaCompile) {
    modularity.inferModulePath = true
}

eclipse {
    classpath {
        file {
            whenMerged { classpath ->
                classpath.entries.findAll { it instanceof org.gradle.plugins.ide.eclipse.model.ProjectDependency }.each { dep ->
                    dep.entryAttributes['module'] = 'true'
                }
            }
        }
    }
}