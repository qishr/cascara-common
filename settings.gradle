pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        mavenCentral()
    }
}


plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'cascara-root'

include 'cascara-common-lib'
include 'cascara-test-common-junit'

 include 'integration-test'
 include 'integration-test-fixtures'
